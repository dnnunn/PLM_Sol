# This configuration is for evaluating the original, pre-trained PLM-Sol model.
# It specifies the correct model architecture to match the pre-trained checkpoint.

model_type: 'PLMSol'

model_parameters:
  # These are the default parameters for the PLMSol model, taken from the original repo's configs
  # We may not need all of them for evaluation, but it's safer to include them.
  num_classes: 1
  hid_dim_alpha: 128
  hid_dim_beta: 128
  n_filters: 128
  kernel_size: 5
  n_heads: 8
  n_layers: 3
  dropout: 0.1

# We still need to point to the test set from our fine-tuning experiment.
# The evaluate_baseline.py script will fill these in from the fine-tuning config.
test_embeddings: null
test_remapping: null
